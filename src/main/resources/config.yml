# ===== Casino - Configuracion =====
prefix: "&6[&eCasino&6] &f"

bet:
  cooldown-seconds: 3
  # Minerales que se pueden apostar y la apuesta MAXIMA por jugada de cada uno.
  items:
    DIAMOND: 16
    EMERALD: 32
    GOLD_INGOT: 64
    IRON_INGOT: 64
    LAPIS_LAZULI: 64
    REDSTONE: 64
    COAL: 64
    NETHERITE_INGOT: 2

coinflip:
  # Probabilidad de ganar (0.48 = 48%). Si ganas recibes el doble de lo apostado.
  win-chance: 0.48

dice:
  # Tiras 2 dados contra la casa. Si sacas mas ganas. Empate = gana la casa.
  win-multiplier: 2.0

slots:
  # Multiplicador con exactamente 2 simbolos iguales (1.0 = recuperas lo apostado)
  pair-multiplier: 1.0
  # Simbolos visuales y multiplicador si salen 3 iguales. Todos con la misma probabilidad.
  # Los premios se redondean hacia abajo (apostar 1 con x1.5 devuelve 1).
  # Retorno teorico con estos valores: ~82%.
  symbols:
    DIAMOND: 20
    EMERALD: 10
    GOLD_INGOT: 6
    REDSTONE: 4
    COAL: 3

roulette:
  # Ruleta con 13 casillas (0 verde, 1-12 rojo/negro alternados).
  # Con estos valores el retorno al jugador es ~92% (igual en color y verde).
  color-multiplier: 2.0
  green-multiplier: 12.0
