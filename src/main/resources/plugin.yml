name: Casino
version: 1.4.0
main: com.casino.CasinoPlugin
api-version: '1.21'
description: Casino que apuesta minerales reales (diamantes, esmeraldas...).
commands:
  casino:
    description: Comando principal del casino
    usage: /casino <slots|coinflip|dados|reload> ...
    aliases: [casinos]
permissions:
  casino.play:
    description: Permite jugar en el casino
    default: true
  casino.admin:
    description: Permite recargar la configuracion
    default: op
